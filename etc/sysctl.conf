# /etc/sysctl.conf - kernel state set at boot by sysctl -f (see sysctl(8)):
# one name=value a line.  Any writable name will do.  /etc/myname sets
# the host name, so this is for the domain:
#kern.domainname=example.org

# connect(2) to the broadcast address of the first interface, or to 0.0.0.0
# (the local host), instead of ENETUNREACH, as POSIX systems do:
net.inet.ip.connect_inaddr_wild=1
