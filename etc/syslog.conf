# /etc/syslog.conf - what syslogd(8) does with a message: selector, a tab,
# action.  A selector is facility[,facility...].level (`*' for every facility,
# level and the more severe ones; =level only that one; !level and !=level
# take them away again; none for no level at all; several separated by `;').
# An action is a file, a list of users (their terminals) or `*' for every user
# logged in.  SIGHUP to syslogd rereads this file and opens the files again.

*.notice;auth,authpriv,cron,ftp,kern,lpr,mail,syslog,user.none	/var/log/messages
kern.debug;syslog.info					/var/log/messages
auth.info						/var/log/authlog
daemon.info						/var/log/daemon

