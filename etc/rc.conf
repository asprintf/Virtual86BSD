# /etc/rc.conf - what /etc/rc starts and how.
#
# Do not change this file: put changes in /etc/rc.conf.local, which is read
# after it (rcctl(8) writes there).  A NAME_flags that is NO leaves the
# daemon off, anything else (an empty value too) starts it, with those flags
# (an empty value: the default ones).  Every daemon is a script in /etc/rc.d.

syslogd_flags=		# syslogd: the system log (syslog.conf(5))
cron_flags=		# crond: run the entries of the crontabs
atd_flags=NO		# atd: run the jobs of at(1) and batch(1)

pkg_scripts=		# more scripts of /etc/rc.d, started after those, in this order

clear_tmp=YES		# remove what /tmp holds at boot; NO keeps it
