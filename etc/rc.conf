# /etc/rc.conf - what /etc/rc starts and how.
#
# Do not change this file: put changes in /etc/rc.conf.local, which is read
# after it.  A NAME_flags that is NO leaves the daemon off, anything else
# (an empty value too) starts it with those flags.

cron_flags=		# crond: run the entries of the crontabs
atd_flags=NO		# atd: run the jobs of at(1) and batch(1)

clear_tmp=YES		# remove what /tmp holds at boot; NO keeps it
